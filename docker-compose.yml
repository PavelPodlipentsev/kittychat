services:
  coturn:
    image: instrumentisto/coturn
    network_mode: host
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
  relay:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: always
